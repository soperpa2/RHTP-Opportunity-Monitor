services:
  - type: web
    name: rhtp-opportunity-monitor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: cron
    name: rhtp-daily-scraper
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_scraper.py
    schedule: "0 12 * * *"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TEST_MODE
        value: "true"
      - key: MAX_SOURCES
        value: "5"
      - key: MAX_LINKS_PER_SOURCE
        value: "2"
